llm:
  # OpenAI-compatible endpoint. For LM Studio this is the server URL + /v1
  # (start the server in LM Studio: Developer tab → Start Server).
  base_url: "http://localhost:1234/v1"
  # Model identifier as shown in LM Studio (the API id under /v1/models).
  model: "qwen/qwen3-8b"
  # LM Studio ignores the key, but the field is accepted by OpenAI-compatible clients.
  api_key: "lm-studio"

paperless_instances:
  - name: "Home"
    url: ""
    token: ""
    inbox_tag: "Inbox"

  # Add more instances as needed:
  # - name: "Work"
  #   url: "https://paperless-work.example.com"
  #   token: "another-api-token"
  #   inbox_tag: "Inbox"

processing:
  max_content_length: 4000   # Max characters of document text sent to LLM
  dry_run: false              # If true, log classifications but don't update documents
  log_level: "INFO"           # DEBUG, INFO, WARNING, ERROR
